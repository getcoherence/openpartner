# DigitalOcean App Platform spec for OpenPartner.
#
# Three deployable components + a managed Postgres, stitched together by
# App Platform's ingress rules so the whole app lives on one domain:
#
#   https://<your-app>.ondigitalocean.app/         → portal (SPA on nginx)
#   https://<your-app>.ondigitalocean.app/api/...  → api   (Node/Express)
#   router runs on a separate component; wire a subdomain (e.g.
#   go.yourdomain.com) to it via the domains section below.
#
# First-time setup:
#   1. Fork / push this repo to GitHub.
#   2. In DO App Platform: Create App → import from GitHub → point at
#      this repo. App Platform will auto-detect .do/app.yaml.
#   3. Set app-level secrets (see `envs` with type: SECRET below).
#   4. Deploy. The API's entrypoint runs migrations on first boot.
#
# Or via doctl:
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <APP_ID> --spec .do/app.yaml    # subsequent updates

name: openpartner
region: nyc

# Database is provisioned externally (e.g., a separate Coherence cluster
# with a dedicated `openpartner` database inside it). DATABASE_URL is set
# as an encrypted secret on each service below. Add this app to the
# cluster's Trusted Sources after the first deploy so it can reach pg.
#
# If you'd rather have App Platform provision a dedicated cluster, paste
# this block back in:
#
#   databases:
#     - name: openpartner-db
#       engine: PG
#       version: '16'
#       production: true
#       cluster_name: openpartner-db
#       db_name: openpartner
#       db_user: openpartner
#
# and change the DATABASE_URL env vars below to:
#   value: ${openpartner-db.DATABASE_URL}

services:
  # Core API. Runs migrations on first boot via docker-entrypoint.sh.
  - name: api
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: getcoherence/openpartner
      branch: main
      deploy_on_push: true
    http_port: 4601
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '4601'
      - key: DATABASE_URL
        type: SECRET
        scope: RUN_TIME
      # App-pool connection — connects as openpartner_app (a NOLOGIN-by-
      # default role provisioned by migration 20260507020000_app_role.ts).
      # Required in multi-tenant deploys: the api refuses to boot when
      # OPENPARTNER_TENANCY=multi and this connection bypasses RLS
      # (unset, superuser, BYPASSRLS or table owner). In single-tenant
      # self-host you can leave it unset and run as the migration role.
      - key: DATABASE_URL_APP
        type: SECRET
        scope: RUN_TIME
      # Password used to provision openpartner_app on migrate. Pair with
      # DATABASE_URL_APP. Rotation: change here, redeploy to re-run the
      # idempotent role migration which alters the password in place.
      - key: OPENPARTNER_APP_DB_PASSWORD
        type: SECRET
        scope: RUN_TIME
      - key: OPENPARTNER_MODE
        value: flat
      # single | multi. Hosted deploys default to multi; flip to single
      # if running a single-tenant fork on App Platform.
      - key: OPENPARTNER_TENANCY
        value: multi
      - key: POSTMARK_MESSAGE_STREAM
        value: outbound
      # Enables the in-process scheduler (usage reporting + payouts).
      # DO App Platform has no native cron, so the api process runs them
      # itself. Set to '0' on replica nodes if you ever scale to instance_count > 1.
      - key: OPENPARTNER_ENABLE_SCHEDULER
        value: '1'
      - key: ADMIN_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: SECRETS_ENCRYPTION_KEY
        type: SECRET
        scope: RUN_TIME
      - key: POSTMARK_SERVER_TOKEN
        type: SECRET
        scope: RUN_TIME
      - key: MAIL_FROM
        type: SECRET
        scope: RUN_TIME
      - key: PORTAL_URL
        type: SECRET
        scope: RUN_TIME
      # Stripe — set as live values when ready to launch. STRIPE_WEBHOOK_SECRET
      # accepts a comma-separated list (one per Event destination).
      - key: STRIPE_SECRET_KEY
        type: SECRET
        scope: RUN_TIME
      - key: STRIPE_WEBHOOK_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: STRIPE_FLAT_PRICE_ID
        type: SECRET
        scope: RUN_TIME
      # Metered usage prices — created by `setup-stripe.mjs` against the
      # live key. Optional in self-host but required for the percentage
      # portion of Flex/Revshare/Network billing to actually fire.
      - key: STRIPE_FLAT_USAGE_PRICE_ID
        type: SECRET
        scope: RUN_TIME
      - key: STRIPE_REVSHARE_USAGE_PRICE_ID
        type: SECRET
        scope: RUN_TIME
      - key: STRIPE_NETWORK_PRICE_ID
        type: SECRET
        scope: RUN_TIME
      - key: STRIPE_NETWORK_USAGE_PRICE_ID
        type: SECRET
        scope: RUN_TIME
      # OpenPartner Stripe App (brands connect their own Stripe) — keys of
      # the app's OWN developer account, never the billing account above.
      # Optional: unset hides "Connect Stripe". docs/stripe-app.md.
      - key: STRIPE_APP_SECRET_KEY
        type: SECRET
        scope: RUN_TIME
      - key: STRIPE_APP_CLIENT_ID
        type: SECRET
        scope: RUN_TIME
      - key: STRIPE_APP_SECRET_KEY_TEST
        type: SECRET
        scope: RUN_TIME
      - key: STRIPE_APP_CLIENT_ID_TEST
        type: SECRET
        scope: RUN_TIME
      - key: STRIPE_APP_WEBHOOK_SECRET
        type: SECRET
        scope: RUN_TIME
      # Until App Review publishes the app: the External test install link.
      - key: STRIPE_APP_AUTHORIZE_URL
        scope: RUN_TIME
      # Optional: unset hides "Continue with Google". Redirect URI to
      # register in Google Cloud: https://app.openpartner.dev/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        type: SECRET
        scope: RUN_TIME
      - key: GOOGLE_CLIENT_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: METRICS_TOKEN
        type: SECRET
        scope: RUN_TIME

  # Click router. Separate component so we can point a marketing apex
  # (go.yourdomain.com) at it without routing through the portal's
  # ingress.
  - name: router
    dockerfile_path: apps/router/Dockerfile
    source_dir: /
    github:
      repo: getcoherence/openpartner
      branch: main
      deploy_on_push: true
    http_port: 4701
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: ROUTER_PORT
        value: '4701'
      - key: DATABASE_URL
        type: SECRET
        scope: RUN_TIME
      - key: COOKIE_DOMAIN
        type: SECRET
        scope: RUN_TIME
      - key: VELOCITY_MAX
        value: '20'
      - key: VELOCITY_WINDOW_MS
        value: '60000'

  # SPA, served by the same nginx image self-hosters run
  # (apps/portal/Dockerfile). A service rather than a static site because
  # a static site can't send response headers, and the portal HTML needs
  # frame-ancestors / X-Frame-Options (docs/deploy-production.md,
  # "Portal frame protection"). Its hashed assets are still cached at
  # App Platform's edge.
  - name: portal
    dockerfile_path: apps/portal/Dockerfile
    source_dir: /
    github:
      repo: getcoherence/openpartner
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
      initial_delay_seconds: 5
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      # The ingress sends /api to the api component, so the portal's own
      # /api/ proxy never runs here. nginx still resolves its upstream at
      # start-up, so this is an address that needs no DNS.
      - key: API_UPSTREAM
        value: 127.0.0.1:4601
        scope: RUN_TIME
      # PostHog product analytics. VITE_-prefixed so Vite inlines the
      # value into the bundle at build time: App Platform passes BUILD_TIME
      # envs to the Dockerfile as build args, which it declares. Same
      # project key as studio-website for unified dashboards.
      - key: VITE_POSTHOG_KEY
        type: SECRET
        scope: BUILD_TIME
      - key: VITE_POSTHOG_HOST
        scope: BUILD_TIME
        value: https://us.i.posthog.com

# App-level routing.
#   /api/* → api (path stripped before forward)
#   /r/*   → router (path preserved — router serves /r/:linkKey directly)
#   /      → portal (everything else; nginx falls back to index.html)
#
# Once you wire `r.openpartner.dev` to the router component via the
# `domains` block, you can remove the /r rule — the subdomain handles it.
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: false
    - match:
        path:
          prefix: /r
      component:
        name: router
    - match:
        path:
          prefix: /
      component:
        name: portal

# Domains: managed in the DO console/API — DELIBERATELY not declared here.
#
# `doctl apps update --spec` REPLACES the whole app spec, domains included.
# The live app's domain list contains entries this file must never own:
#   - app.openpartner.dev (PRIMARY, DO-managed zone) — added via console
#   - white-label customer domains (portal.<tenant>.com, type ALIAS, no
#     zone — customer-owned DNS), added per tenant at onboarding and
#     removed on entitlement lapse (docs/white-label-onboarding-runbook.md)
# Declaring a domains block here and running `doctl apps update --spec`
# would wipe every dynamically-added customer domain: certs revoked,
# white-label portals down. Keep ALL domains in the console/API.
#
# (For a fresh self-hosted fork with no white-label customers, adding a
# domains block is fine — the hazard is only mixing declarative spec
# updates with dynamically-managed customer domains.)
