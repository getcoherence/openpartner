name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should it do? API shape, UI sketch, example config — whatever's concrete.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why this one wins.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Which parts of the system does this touch?
      options:
        - label: API / attribution engine
        - label: Router (click redirect)
        - label: Portal (UI)
        - label: SDK
        - label: DB schema / migrations
        - label: Deployment / infra
        - label: Docs
