  <!-- Sub-line: tightens the value prop without being a wall of text -->
  <text
    x="80"
    y="498"
    fill="#9aa0a6"
    font-size="24"
    font-weight="400"
    letter-spacing="-0.3"
  >Affiliate, referral, and creator programs · built-in marketplace · direct Stripe payouts</text>

